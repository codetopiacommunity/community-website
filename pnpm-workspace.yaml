packages:
  - .

overrides:
  # Transitive dependencies pinned forward past published advisories.
  # A bare key forces every consumer onto a fixed line; a version-ranged key
  # rewrites only the vulnerable versions, which is what anything with a live
  # major boundary needs.
  postcss: ">=8.5.23"
  brace-expansion: ">=5.0.9"
  qs: ">=6.16.0"
  fast-uri: ">=3.1.6"
  browserslist@<=4.28.6: ^4.28.7
  deepmerge-ts@<8.0.0: ^8.0.0
  mysql2@<=3.23.0: ^3.23.1
  nanoid@<3.3.18: ^3.3.18
  sharp@<0.35.0: ^0.35.0
  vite@>=8.0.0 <=8.0.15: ^8.0.16

allowBuilds:
  '@prisma/engines': true
  msw: false
  prisma: true
  sharp: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@napi-rs/wasm-runtime"
  - "eslint"
  - qs@6.15.4 || 6.16.0
