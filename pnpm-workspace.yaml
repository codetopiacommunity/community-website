packages:
  - .

overrides:
  # Transitive dependencies pinned forward past published advisories.
  # A bare key forces every consumer onto a fixed line; a version-ranged key
  # rewrites only the vulnerable versions, which is what anything with a live
  # major boundary needs.
  postcss: ">=8.5.23"
  brace-expansion: ">=5.0.12"
  qs: ">=6.16.1"
  fast-uri: ">=4.2.3"
  browserslist@<=4.28.6: ^4.28.7
  hono@<4.13.11: ^4.13.11
  ip-address@<=10.7.3: ^10.7.4
  deepmerge-ts@<8.0.0: ^8.0.0
  mysql2@<=3.23.0: ^3.23.1
  nanoid@<3.3.18: ^3.3.18
  sharp@<0.35.5: ^0.35.5
  undici@>=7.0.0 <7.30.1: ^7.30.1
  vite@>=8.0.0 <8.2.4: ^8.2.4
  "@hono/node-server@>=1.19.10 <2.1.3": ^2.1.3
  "@modelcontextprotocol/sdk@<1.32.0": ^1.32.0
  "@vitest/mocker@<4.1.12": ^4.1.12
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  postcss-selector-parser@<6.1.5: ^6.1.5
  postcss-selector-parser@>=7.0.0 <7.1.6: ^7.1.6
  proxy-addr@<2.0.8: ^2.0.8
  source-map-js@<1.2.2: ^1.2.2
  systeminformation@<5.33.16: ^5.33.16
  zod@<4.6.6: ^4.6.6

allowBuilds:
  '@prisma/engines': true
  msw: false
  prisma: true
  sharp: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@napi-rs/wasm-runtime"
  - "eslint"
  - qs@6.15.4 || 6.16.0
